morning-summary.timer       { OnCalendar=*-*-* 07:30:00 ; next_elapse=Sun 2026-10-04 07:30:00 CEST }
notes-sync.timer            { OnCalendar=*:0/15 ; next_elapse=Sat 2026-10-03 10:30:00 CEST }
