exit-code = 0
stdout = '''
== /etc/cron.d/timeshift-boot
@reboot root sleep 10m && timeshift --create --scripted --tags B
== /etc/cron.d/timeshift-hourly
0 9-21 * * * root timeshift --check --scripted
'''

