[[docs]]
path = "docs/operations.md"

[[probes]]
name = "custom-timers"
command = '''
for unit in /etc/systemd/system/*.timer; do
  name=$(basename "$unit")
  printf '%-27s %s\n' "$name" "$(systemctl show -p TimersCalendar --value "$name")"
done
'''
notes = "Timers defined in /etc/systemd/system and their calendar specs, in local time."

[[probes]]
name = "user-timers"
command = "systemctl --user list-timers --all --no-pager"

[[probes]]
name = "user-onfailure"
command = "systemctl --user show -p OnFailure --value docs-sync.service"
