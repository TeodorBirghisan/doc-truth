name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventional-commits:
    name: conventional-commits
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check the title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|test|refactor|perf|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [^ ].*$'
          if [[ "$TITLE" =~ $pattern || "$TITLE" == Revert\ \"* ]]; then
            exit 0
          fi
          echo "::error::The title becomes the commit message on main and must follow Conventional Commits, e.g. 'fix(collect): mark timed-out probes as failed'. Got: $TITLE"
          exit 1
