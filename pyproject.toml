[project]
name = "doc-truth"
version = "0.1.0.dev0"
description = "Check what your operations docs claim against what your systems actually run"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Teodor Birghisan" }]
requires-python = ">=3.14"
dependencies = []
keywords = ["documentation", "drift", "runbooks", "operations", "homelab", "llm"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Documentation",
    "Topic :: System :: Systems Administration",
]

[project.scripts]
doc-truth = "doc_truth.cli:main"

[project.urls]
Repository = "https://github.com/TeodorBirghisan/doc-truth"
Issues = "https://github.com/TeodorBirghisan/doc-truth/issues"

[build-system]
requires = ["uv_build>=0.11.25,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "--strict-config", "-rf"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
